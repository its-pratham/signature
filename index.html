<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orbrick — Email Signature Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&family=Solway:wght@800&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'PT Sans',Tahoma,sans-serif;background:#dedad4;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:28px 16px 36px;gap:18px;color:#141413}
    .panel{background:#fff;border-radius:18px;padding:18px 22px;width:100%;max-width:1060px;display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;box-shadow:0 2px 20px rgba(0,0,0,.09)}
    .panel-logo{align-self:center;padding-right:3px}.panel-logo img{height:40px;width:auto;display:block}
    .fields{display:flex;gap:14px;flex:1;flex-wrap:wrap}.fg{display:flex;flex-direction:column;gap:5px;flex:1;min-width:175px}
    .fg label,.section-label{font-size:10px;font-weight:700;color:#5B2A86;text-transform:uppercase;letter-spacing:1px}
    .fg input{width:100%;border:1.5px solid #e0dbd8;border-radius:9px;padding:9px 13px;font-family:'PT Sans',sans-serif;font-size:15px;color:#141413;background:#faf9f6;outline:none;transition:border-color .18s,box-shadow .18s}
    .fg input:focus{border-color:#f08519;box-shadow:0 0 0 3px rgba(240,133,25,.14)}.fg input::placeholder{color:#b0aba5}
    .design-section{width:100%;display:flex;flex-direction:column;gap:9px;padding-top:14px;border-top:1.5px solid #f0ede6}
    .designs{display:flex;gap:10px;flex-wrap:wrap}.design{width:142px;min-height:76px;border:2px solid transparent;border-radius:10px;background:#faf9f6;cursor:pointer;padding:10px;display:flex;flex-direction:column;justify-content:space-between;transition:border-color .18s,transform .12s;overflow:hidden}.design:hover{transform:translateY(-2px)}.design.active{border-color:#f08519;box-shadow:0 0 0 2px rgba(240,133,25,.2)}.design b{font-size:13px;color:#5B2A86}.design small{font-size:10px;color:#8f8982}.swatch{height:7px;border-radius:10px;width:100%}.classic .swatch{background:linear-gradient(90deg,#5a2b86 0 52%,#f08519 52%)}.luxe .swatch{background:linear-gradient(90deg,#1a1033,#f5a623)}.minimal .swatch{background:linear-gradient(90deg,#6b4fa0 0 7%,#fff 7%)}.split .swatch{background:linear-gradient(90deg,#5b3a9e 0 32%,#fafafa 32%)}
    .photo-control{display:flex;align-items:center;gap:12px;flex:0 0 auto}.photo-label{display:inline-flex;align-items:center;gap:7px;cursor:pointer;background:#f4f1ec;border:1.5px dashed #c8c2bb;border-radius:10px;color:#5B2A86;font-size:12.5px;font-weight:700;padding:10px 14px;transition:.15s}.photo-label:hover{background:#ede8e0;border-color:#f08519;color:#f08519}.photo-note{font-size:11px;color:#9a9590;max-width:125px;line-height:1.25}
    .btn-dl{background:#f08519;border:none;border-radius:10px;color:#fff;font-family:'PT Sans',sans-serif;font-size:13.5px;font-weight:700;padding:11px 22px;cursor:pointer;display:flex;align-items:center;gap:7px;white-space:nowrap;box-shadow:0 2px 10px rgba(240,133,25,.28);transition:.15s}.btn-dl:hover{background:#d9730d}.btn-dl:active{transform:scale(.97)}.btn-dl svg{width:15px;height:15px}
    .preview-wrap{width:100%;max-width:1060px;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 8px 48px rgba(0,0,0,.18)}.preview-title{padding:12px 18px;background:#faf9f6;border-bottom:1px solid #eee9e3;color:#5B2A86;text-transform:uppercase;font-size:10px;font-weight:bold;letter-spacing:1px}.preview-stage{min-height:360px;padding:46px 28px;display:flex;align-items:center;justify-content:center;background:repeating-conic-gradient(#f4f1ec 0 25%,#fff 0 50%) 50%/24px 24px;overflow:auto}.preview-stage iframe{border:0;display:block;background:transparent;min-width:760px;height:285px}.hint{font-size:11.5px;color:#77716b;letter-spacing:.2px;text-align:center}.hint strong{color:#5B2A86}
    @media(max-width:620px){body{padding:16px 10px 24px}.panel{padding:16px}.panel-logo{width:100%}.photo-control{width:100%}.preview-stage{justify-content:flex-start;padding:30px 16px}.design{width:calc(50% - 5px)}}
  </style>
</head>
<body>
  <section class="panel">
    <div class="panel-logo"><img src="https://orbrick.com/wp-content/uploads/2024/08/Main-logoTransparent.png" alt="Orbrick"></div>
    <div class="fields">
      <div class="fg"><label for="name">Full name</label><input id="name" maxlength="50" value="Brix Stir Orbronaut" placeholder="e.g. Jane Smith"></div>
      <div class="fg"><label for="designation">Designation</label><input id="designation" maxlength="70" value="Consulting Genius" placeholder="e.g. Founder & CEO"></div>
      <div class="fg"><label for="phone">Mobile number</label><input id="phone" maxlength="30" value="+91 9997773627" placeholder="e.g. +91 98765 43210"></div>
    </div>
    <div class="photo-control"><label class="photo-label" for="photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><path d="M12 21V9m0 0 4 4m-4-4-4 4M5 3h14"/></svg>Upload Photo<input id="photo" type="file" accept="image/*" hidden></label><span class="photo-note">Portrait images work best.</span></div>
    <div class="design-section"><span class="section-label">Choose signature design</span><div class="designs" id="designs">
      <button class="design classic active" data-design="classic" type="button"><b>Classic</b><small>Clean and familiar</small><i class="swatch"></i></button>
      <button class="design luxe" data-design="luxe" type="button"><b>Dark Luxe</b><small>Rich, premium card</small><i class="swatch"></i></button>
      <button class="design minimal" data-design="minimal" type="button"><b>Clean Minimal</b><small>Simple white card</small><i class="swatch"></i></button>
      <button class="design split" data-design="split" type="button"><b>Split Block</b><small>Bold purple sidebar</small><i class="swatch"></i></button>
    </div></div>
    <div class="design-section"><span class="section-label">Social &amp; custom links</span><div class="fields">
      <div class="fg"><label for="url-linkedin">LinkedIn URL</label><input id="url-linkedin" type="url" value="https://in.linkedin.com/company/orbrick" placeholder="https://linkedin.com/in/your-name"></div>
      <div class="fg"><label for="url-instagram">Instagram URL</label><input id="url-instagram" type="url" value="https://www.instagram.com/orbrick" placeholder="https://instagram.com/your-handle"></div>
      <div class="fg"><label for="url-blog">Blog URL</label><input id="url-blog" type="url" value="https://www.orbrick.com/blog" placeholder="https://yourwebsite.com/blog"></div>
      <div class="fg"><label for="url-custom">Custom URL</label><input id="url-custom" type="url" placeholder="https://yourwebsite.com"></div>
    </div></div>
    <button class="btn-dl" id="download" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5M12 15V3"/></svg>Download HTML</button>
  </section>
  <section class="preview-wrap"><div class="preview-title">Live signature preview</div><div class="preview-stage"><iframe id="preview" title="Email signature preview" sandbox="allow-same-origin"></iframe></div></section>
  <p class="hint"><strong>Ready for Outlook.</strong> Upload a portrait, choose a design, then download the HTML file to paste into your email signature.</p>
  <script>
    const instagramIcon='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><defs><linearGradient id="g" x1="7" y1="41" x2="41" y2="7" gradientUnits="userSpaceOnUse"><stop stop-color="#FEDA75"/><stop offset=".5" stop-color="#D62976"/><stop offset="1" stop-color="#4F5BD5"/></linearGradient></defs><rect width="48" height="48" rx="11" fill="url(#g)"/><rect x="12" y="12" width="24" height="24" rx="7" fill="none" stroke="#fff" stroke-width="3"/><circle cx="24" cy="24" r="5.5" fill="none" stroke="#fff" stroke-width="3"/><circle cx="31.5" cy="16.5" r="2" fill="#fff"/></svg>');
    const urls={logo:'https://orbrick.com/wp-content/uploads/2024/08/Main-logoTransparent.png',linkedin:'https://orbrick.com/wp-content/uploads/2024/08/LinkedIn_logo_initials.png',instagram:instagramIcon,blog:'https://orbrick.com/wp-content/uploads/2024/08/rss-round-color-icon-2.png'};
    const links={site:'https://www.orbrick.com'};
    const globeIcon='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#5B2A86" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>');
    const fallback='https://orbrick.com/wp-content/uploads/2024/08/sigImage.png'; let photo=fallback, design='classic';
    const $=id=>document.getElementById(id), esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const cleanUrl=id=>{const value=$(id).value.trim();if(!value)return '';try{const url=new URL(value);return /^https?:$/.test(url.protocol)?esc(url.href):''}catch{return ''}};
    const vals=()=>({name:esc($('name').value.trim()||'Your Name'),title:esc($('designation').value.trim()||'Your Designation'),phone:esc($('phone').value.trim()||'+91 00000 00000'),photo,linkedin:cleanUrl('url-linkedin'),instagram:cleanUrl('url-instagram'),blog:cleanUrl('url-blog'),custom:cleanUrl('url-custom')});
    function social(v,size=26){const iconStyle=`border:0;display:inline-block;margin-right:5px;width:${size}px;height:${size}px`;return [{url:v.linkedin,icon:urls.linkedin,label:'LinkedIn'},{url:v.instagram,icon:urls.instagram,label:'Instagram'},{url:v.blog,icon:urls.blog,label:'Blog'},{url:v.custom,icon:globeIcon,label:'Website'}].filter(item=>item.url).map((item,index,items)=>`<a href="${item.url}" style="text-decoration:none"><img src="${item.icon}" width="${size}" height="${size}" style="${iconStyle}${index===items.length-1?';margin-right:0':''}" alt="${item.label}"></a>`).join('')}
    function signature(v){const common=`<!DOCTYPE html><html><head><meta charset="utf-8"></head><body style="margin:0;padding:0;font-family:Tahoma,Arial,sans-serif;font-size:10pt;">`; const logo=`<a href="${links.site}" style="text-decoration:none"><img src="${urls.logo}" width="160" style="border:0;display:block" alt="Orbrick"></a>`;
      if(design==='luxe')return `${common}<table cellpadding="0" cellspacing="0" width="520" style="background:#1A1033;border-radius:14px;color:#fff"><tr><td style="padding:22px"><img src="${v.photo}" width="150" height="170" style="display:block;object-fit:cover;border-radius:75px;border:3px solid #F5A623"></td><td style="width:2px;background:#F5A623;font-size:1px">&nbsp;</td><td style="padding:22px 22px 22px 24px"><div style="font:700 22px Georgia,serif;color:#fff">${v.name}</div><div style="margin:5px 0 14px;color:#F5A623;font-size:11px;font-weight:bold;letter-spacing:1.7px;text-transform:uppercase">${v.title}</div><div style="margin-bottom:14px;color:#c9bedc"><b style="color:#F5A623">M:</b> ${v.phone}</div>${logo}<div style="margin-top:14px">${social(v,25)}</div></td></tr></table></body></html>`;
      if(design==='minimal')return `${common}<table cellpadding="0" cellspacing="0" width="540" style="border:1px solid #E8E3F0;border-radius:14px"><tr><td style="width:5px;background:#6B4FA0;border-radius:14px 0 0 14px">&nbsp;</td><td style="padding:22px"><img src="${v.photo}" width="150" height="170" style="display:block;object-fit:cover;border-radius:10px"></td><td style="padding:22px 24px 22px 0"><div style="font-size:21px;font-weight:bold;color:#5A2B86">${v.name}</div><div style="margin:4px 0 13px;color:#f08519;font-size:11px;font-weight:bold;letter-spacing:1.5px;text-transform:uppercase">${v.title}</div><div style="border-top:1px solid #e8e3f0;padding-top:12px;margin-bottom:14px;color:#5A2B86"><b>M:</b> ${v.phone}</div>${logo}<div style="margin-top:12px">${social(v)}</div></td></tr></table></body></html>`;
      if(design==='split')return `${common}<table cellpadding="0" cellspacing="0" width="455" style="border:1px solid #E2D9F3;border-radius:14px;overflow:hidden"><tr><td width="130" align="center" style="background:#5B3A9E;padding:24px 12px"><img src="${v.photo}" width="100" height="113" style="display:block;object-fit:cover;border-radius:60px;border:3px solid rgba(255,255,255,.35);margin:auto"><div style="margin-top:14px">${social(v,22)}</div></td><td style="background:#fafafa;padding:22px 24px"><div style="font-size:21px;font-weight:bold;color:#1C0F40">${v.name}</div><div style="margin:4px 0 15px;color:#f08519;font-size:11px;font-weight:bold;letter-spacing:1.5px;text-transform:uppercase">${v.title}</div><div style="margin-bottom:16px;color:#6A6280"><span style="color:#5B3A9E">&bull;</span>&nbsp; ${v.phone}</div>${logo}</td></tr></table></body></html>`;
      return `${common}<table cellpadding="0" cellspacing="0" width="430"><tr><td width="150" valign="top"><img src="${v.photo}" width="150" height="170" style="display:block;object-fit:cover;border:0"></td><td width="30">&nbsp;</td><td valign="top"><div style="font-size:19px;font-weight:bold;color:#5A2B86">${v.name}</div><div style="margin:3px 0 10px;color:#f08519;font-size:14px">${v.title}</div><div style="margin-bottom:10px;color:#5A2B86"><b>M:</b> ${v.phone}</div>${logo}<div style="margin-top:8px">${social(v,25)}</div></td></tr></table></body></html>`;
    }
    function render(){const html=signature(vals());$('preview').srcdoc=html;return html}
    ['name','designation','phone','url-linkedin','url-instagram','url-blog','url-custom'].forEach(id=>$(id).addEventListener('input',render)); document.querySelectorAll('.design').forEach(b=>b.addEventListener('click',()=>{design=b.dataset.design;document.querySelectorAll('.design').forEach(x=>x.classList.toggle('active',x===b));render()}));
    $('photo').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=event=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=150;c.height=170;const x=c.getContext('2d'),scale=Math.max(150/img.width,170/img.height),w=img.width*scale,h=img.height*scale;x.drawImage(img,(150-w)/2,(170-h)/2,w,h);photo=c.toDataURL('image/png');render()};img.src=event.target.result};reader.readAsDataURL(file);e.target.value=''});
    $('download').addEventListener('click',()=>{const name=$('name').value.trim().replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'')||'signature';const blob=new Blob([render()],{type:'text/html;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`orbrick-signature-${name}.html`;a.click();URL.revokeObjectURL(a.href)});render();
  </script>
</body>
</html>
